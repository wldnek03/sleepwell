<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SleepWell — 2분 수면 백색소음</title>
<meta name="description" content="2분 유도 시퀀스로 아이를 재우는 백색소음기">
<meta name="theme-color" content="#07060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SleepWell">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main id="app">

  <!-- ===== 홈 ===== -->
  <section id="home" class="screen">
    <header class="top">
      <div class="brand">
        <h1>SleepWell</h1>
        <p>2분 수면 유도</p>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-stats" aria-label="기록">기록</button>
        <button class="icon-btn" id="btn-safety" aria-label="안전 수칙">안전</button>
      </div>
    </header>

    <div class="presets" id="presets"></div>
    <p class="preset-desc" id="preset-desc"></p>

    <div class="play-wrap">
      <button class="play" id="btn-play">
        <span class="play-icon"></span>
        <span class="play-label" id="play-label">시작</span>
      </button>
    </div>

    <div class="rows">
      <div class="row">
        <span class="row-label">종료 타이머</span>
        <div class="chips" id="timers"></div>
      </div>
      <div class="row">
        <span class="row-label">화면 켜두기</span>
        <button class="toggle" id="toggle-wake" role="switch" aria-checked="false"><span></span></button>
      </div>
    </div>

    <p class="hint">
      처음 20초는 <b>일부러 크게</b> 시작합니다. 아이 울음보다 살짝 크게 들리도록
      볼륨을 맞춘 뒤, 그대로 두세요. 소리는 2분에 걸쳐 저절로 작아지고 어두워집니다.
    </p>
  </section>

  <!-- ===== 재생 중 ===== -->
  <section id="player" class="screen" hidden>
    <div class="orb-wrap">
      <div class="orb" id="orb">
        <div class="orb-ring r1"></div>
        <div class="orb-ring r2"></div>
        <div class="orb-core" id="orb-core"></div>
      </div>
    </div>

    <div class="status">
      <div class="phase" id="phase-label">유도 중</div>
      <div class="elapsed" id="elapsed">0:00</div>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
      <div class="phase-sub" id="phase-sub"></div>
    </div>

    <div class="player-actions">
      <button class="big-btn primary" id="btn-slept">잠들었어요 😴</button>
      <button class="big-btn ghost" id="btn-stop">정지</button>
    </div>
  </section>

</main>

<!-- 화면을 어둡게 덮는 레이어 (불빛으로 아이를 깨우지 않도록) -->
<div id="dim" hidden><span>탭하면 밝아집니다</span></div>

<!-- 시트 -->
<div id="sheet-backdrop" hidden></div>
<section id="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-head">
    <h2 id="sheet-title"></h2>
    <button class="icon-btn" id="sheet-close">닫기</button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<div id="toast" hidden></div>

<audio id="a-main" playsinline preload="auto"></audio>
<audio id="a-hold" playsinline preload="auto" loop></audio>

<script src="js/presets.js"></script>
<script src="js/synth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
